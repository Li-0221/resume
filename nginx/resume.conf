server {
    listen 80;
    server_name resume.inwe-ai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name resume.inwe-ai.com;
    root /var/www/resume.inwe-ai.com;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/resume.inwe-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.inwe-ai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
